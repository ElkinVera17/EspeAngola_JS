<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registro de espeAngola</title>
    <!-- Boostrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- CSS-->
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/registro.css">

    <link rel="icon" href="../img/Login/Registro.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>



<body><!-- style="background-color: #f4f4f4;" text-align="center" -->
    <section><!-- style="text-align: center; font-family: Arial, Helvetica, sans-serif; " -->
        <figure>
            <img src="../img/espe.png" alt="logo Espe"><!-- style="width: 300px; height: auto;" -->
            <figcaption>Universidad de las FFAA ESPE</figcaption>
        </figure>
    </section>


    <header><!-- style="text-align:center" -->
        <h1>Registro de usuario</h1>
    </header>

    <nav><!-- style="background: #0a631e;" -->
        <a href="../index.html"><!-- style="color: white; text-decoration: none;" -->Salir</a>
    </nav>


    <section class="registrate"><!-- style="text-align: center; font-family: Arial, Helvetica, sans-serif; " -->
        <form action="../Principal/Angola.html" method="post">
            <fieldset>
                <legend>Registro</legend>

                <div class="campo">
                    <label for="Nombres">Nombres: <i class="fa-solid fa-user"></i></label>
                    <input type="text" id="Nombres" name="Nombres" maxlength="16" minlength="8" required>
                </div>


                <div class="campo">
                    <label for="Apellido">Apellido: <i class="fa-solid fa-user"></i></label>
                    <input type="text" id="Apellido" name="Apellido" maxlength="16" minlength="8" required>
                </div>
                <div class="campo">
                    <label for="Cedula">Cédula: <i class="fa-solid fa-id-card"></i></label>
                    <input type="text" id="Cedula" name="Cedula" maxlength="10" minlength="10" required
                        pattern="^\d{10}$" title="La cédula debe contener exactamente 10 dígitos numéricos.">
                </div>
                <div class="campo">
                    <label for="Fecha de nacimiento">Fecha de nacimiento: <i
                            class="fa-solid fa-birthday-cake"></i></label>
                    <input type="date" id="Fecha de nacimiento" name="Fecha de nacimiento" required>
                </div>
                <div class="campo">
                    <label for="Genero"> Género: <i class="fa-solid fa-venus-mars"></i></label>
                    <select id="Genero" name="Genero" required>
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="Correo">Correo electrónico: <i class="fa-solid fa-envelope"></i></label>
                    <input type="email" id="Correo" name="Correo" required>
                </div>

                <div class="campo campo-nacionalidad" style="position: relative;">
                    <label for="buscarPais">Nacionalidad: <i class="fa-solid fa-earth-americas"></i></label>
                    <input type="text" id="buscarPais" placeholder="Escribe tu país..." autocomplete="off" required>
                    <input type="hidden" id="paisSeleccionado" name="Nacionalidad">
                    <ul id="listaPaises"
                        style="position:absolute; z-index:10; background:#fff; list-style:none; margin:0; padding:5px; width:100%; display:none; border:1px solid #ccc;">
                    </ul>
                    <p id="paisSeleccionadoTexto" style="margin-top:5px;"></p>
                    <small id="estadoPaises" style="color:gray;"></small>
                </div>


            </fieldset>
            <fieldset>
                <legend>Contraseña</legend>
                <div class="campo">

                    <label for="password">Contraseña: <i class="fa-solid fa-key"></i></label>
                    <input type="password" id="password" name="password" required minlength="8" maxlength="16">
                </div>
                <div class="campo">
                    <label for="confirmPassword">Confirmar: <i class="fa-solid fa-key"></i></label>
                    <input type="password" id="confirmPassword" name="password" required minlength="8" maxlength="16">
                </div>
                <div class="campo">
                    <label for="usuario">Usuario: <i class="fa-solid fa-user"></i></label>
                    <input type="text" id="usuario" name="usuario" maxlength="16" minlength="8">
                </div>
            </fieldset>
            <input type="submit" value="Registrarse">
        </form>
    </section>

    <footer><!-- style="background-color: rgb(28, 126, 41); text-align: center;" -->
        <p>Elking &copy; 2026 EspeAngola. Todos los derechos reservados.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>


</body>

</html>
