<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Boostrap-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- CSS-->
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/login.css">
    <title>Espe estudiantes</title>
    <link rel="icon" href="img/Login/Universidad.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    
</head>

<body>

    <header class="header">
        <h1>Bienvenidos a la ESPE</h1>
    </header>

    <figure class="logo-container">
        <img src="img/espe.png" alt="Logo Espe">
        <figcaption>Universidad de las Fuerzas Armadas Espe</figcaption>
    </figure>

    <section class="fondo">
        <section class="login-card">
            <form method="post" action="Principal/Angola.html">
                <fieldset>
                    <legend>Login</legend>

                    <label for="usuario" >Usuario</label>
                    <div class="input-log">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="usuario" name="Usuario" 
                           required>

                    </div>

                    <label for="password">Contraseña</label>
                    <div class="input-log">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="Contraseña" 
                            required>

                    </div>

                    <button id="boton-login" type="submit">Ingresar</button>
                </fieldset>
            </form>
            
            <section class="registro-box">
                <legend>¿No tienes una cuenta?</legend>
                <a href="pages/registro.html">Registrarse</a>
            </section>
        </section>


    </section>



    <footer>
        <p>© 2026 Espe. Todos los derechos reservados</p>
    </footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="js/toast.js"></script>


<script src="js/login.js"></script>


</body>
